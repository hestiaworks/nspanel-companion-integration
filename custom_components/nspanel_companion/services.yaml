notify:
  # The entity filter also narrows the device and area pickers to panels.
  target:
    entity:
      integration: nspanel_companion
  fields:
    message:
      required: true
      example: "The washing machine has finished"
      selector:
        text:
          multiline: true
    title:
      example: "Laundry"
      selector:
        text:
    importance:
      default: normal
      selector:
        select:
          options:
            - normal
            - important
          translation_key: importance
    sound:
      selector:
        select:
          options:
            - "off"
            - notify_soft
            - notify_chime
            - notify_ping
            - notify_bright
            - notify_confirm
            - notify_query
            - notify_glass
            - notify_kalimba
            - notify_knock
            - notify_vibraphone
            - notify_drop
            - notify_music_box
            - notify_alert
            - notify_double
            - notify_rise
            - notify_confirm_long
            - notify_triple
            - notify_kalimba_run
            - notify_bell_chord
          translation_key: sound
    duration:
      selector:
        number:
          min: 3
          max: 30
          unit_of_measurement: s
    repeat_every:
      selector:
        select:
          options:
            - "0"
            - "30"
            - "60"
            - "120"
            - "300"
          translation_key: repeat_every
    repeat_times:
      selector:
        select:
          options:
            - "0"
            - "3"
            - "5"
            - "10"
          translation_key: repeat_times
